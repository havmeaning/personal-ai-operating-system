<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180" role="img" aria-labelledby="title desc">
  <title id="title">P.Ai.O.S. Lifecycle</title>
  <desc id="desc">Formation, activation, productization, evidence integration, evaluation, and transfer testing.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #17202a; }
    .box { fill: #f7f9fb; stroke: #2f4858; stroke-width: 2; rx: 6; }
    .arrow { stroke: #2f4858; stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f4858" />
    </marker>
  </defs>
  <rect class="box" x="20" y="60" width="120" height="58"/><text x="80" y="86" text-anchor="middle" font-size="13">System</text><text x="80" y="104" text-anchor="middle" font-size="13">formation</text>
  <line class="arrow" x1="140" y1="89" x2="165" y2="89"/>
  <rect class="box" x="165" y="60" width="120" height="58"/><text x="225" y="86" text-anchor="middle" font-size="13">Platform</text><text x="225" y="104" text-anchor="middle" font-size="13">formation</text>
  <line class="arrow" x1="285" y1="89" x2="310" y2="89"/>
  <rect class="box" x="310" y="60" width="120" height="58"/><text x="370" y="86" text-anchor="middle" font-size="13">Ecosystem</text><text x="370" y="104" text-anchor="middle" font-size="13">activation</text>
  <line class="arrow" x1="430" y1="89" x2="455" y2="89"/>
  <rect class="box" x="455" y="60" width="120" height="58"/><text x="515" y="95" text-anchor="middle" font-size="13">Productization</text>
  <line class="arrow" x1="575" y1="89" x2="600" y2="89"/>
  <rect class="box" x="600" y="60" width="120" height="58"/><text x="660" y="86" text-anchor="middle" font-size="13">Evidence</text><text x="660" y="104" text-anchor="middle" font-size="13">integration</text>
  <line class="arrow" x1="720" y1="89" x2="745" y2="89"/>
  <rect class="box" x="745" y="60" width="135" height="58"/><text x="812" y="86" text-anchor="middle" font-size="13">Evaluation and</text><text x="812" y="104" text-anchor="middle" font-size="13">transfer testing</text>
</svg>
