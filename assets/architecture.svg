<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">P.Ai.O.S. Architecture</title>
  <desc id="desc">Inputs become structured evidence, decisions, reports, and reusable doctrine.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #17202a; }
    .box { fill: #f7f9fb; stroke: #2f4858; stroke-width: 2; rx: 6; }
    .arrow { stroke: #2f4858; stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f4858" />
    </marker>
  </defs>
  <rect class="box" x="250" y="20" width="260" height="52"/>
  <text x="380" y="52" text-anchor="middle" font-size="16">Inputs</text>
  <line class="arrow" x1="380" y1="72" x2="380" y2="105"/>
  <rect class="box" x="250" y="105" width="260" height="52"/>
  <text x="380" y="137" text-anchor="middle" font-size="16">Capture and structure</text>
  <line class="arrow" x1="380" y1="157" x2="380" y2="190"/>
  <rect class="box" x="250" y="190" width="260" height="52"/>
  <text x="380" y="222" text-anchor="middle" font-size="16">Analysis and decision</text>
  <line class="arrow" x1="380" y1="242" x2="380" y2="275"/>
  <rect class="box" x="250" y="275" width="260" height="52"/>
  <text x="380" y="307" text-anchor="middle" font-size="16">Execution</text>
  <line class="arrow" x1="510" y1="301" x2="610" y2="301"/>
  <rect class="box" x="610" y="275" width="120" height="52"/>
  <text x="670" y="307" text-anchor="middle" font-size="15">Reports</text>
  <line class="arrow" x1="610" y1="327" x2="510" y2="360"/>
  <rect class="box" x="250" y="350" width="260" height="52"/>
  <text x="380" y="382" text-anchor="middle" font-size="16">Doctrine and assets</text>
  <path class="arrow" d="M250 376 C90 376 90 46 250 46" fill="none"/>
</svg>
