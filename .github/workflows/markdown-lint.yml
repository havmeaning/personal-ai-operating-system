name: Markdown lint placeholder

on:
  pull_request:
  push:
    branches: [main]

jobs:
  basic-markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Markdown files are non-empty
        run: |
          find . -name "*.md" -not -path "./.git/*" -print0 | while IFS= read -r -d '' file; do
            test -s "$file"
          done
