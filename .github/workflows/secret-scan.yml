name: Secret and private-data scan

on:
  pull_request:
  push:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for high-risk patterns
        run: |
          python - <<'PY'
          import pathlib, re, sys, zipfile
          patterns = [
              r'AKIA[0-9A-Z]{16}',
              r'-----BEGIN [A-Z ]*PRIVATE KEY-----',
              r'(?i)claim number\s*[:#]',
              r'(?i)file number\s*[:#]',
              r'https://gofund\.me/',
          ]
          sensitive_name_patterns = [
              r'(^|/)\.env($|\.)',
              r'(?i)(^|/).*private.*key.*',
              r'(?i)(^|/).*credentials?.*',
              r'(?i)(^|/).*secret.*',
              r'(?i)(^|/).*password.*',
              r'(?i)(^|/).*token.*',
              r'(?i)(^|/).*id_rsa.*',
          ]
          text_suffixes = {
              '.txt', '.md', '.csv', '.json', '.yaml', '.yml', '.xml',
              '.html', '.htm', '.css', '.js', '.mjs', '.ts', '.tsx',
              '.py', '.ps1', '.sh', '.cff', '.m3u'
          }
          max_member_scan_bytes = 1024 * 1024
          ok = True

          def has_high_risk_text(text):
              return any(re.search(pattern, text) for pattern in patterns)

          def check_zip(path):
              global ok
              try:
                  with zipfile.ZipFile(path) as zf:
                      bad_file = zf.testzip()
                      if bad_file is not None:
                          print(f'Invalid ZIP member in {path}: {bad_file}')
                          ok = False
                      for info in zf.infolist():
                          name = info.filename.replace('\\', '/')
                          parts = pathlib.PurePosixPath(name).parts
                          if pathlib.PurePosixPath(name).is_absolute() or '..' in parts:
                              print(f'Unsafe ZIP path in {path}: {name}')
                              ok = False
                          if any(re.search(pattern, name) for pattern in sensitive_name_patterns):
                              print(f'Sensitive ZIP filename pattern in {path}: {name}')
                              ok = False
                          suffix = pathlib.PurePosixPath(name).suffix.lower()
                          if suffix in text_suffixes and info.file_size <= max_member_scan_bytes:
                              try:
                                  text = zf.read(info).decode('utf-8')
                              except UnicodeDecodeError:
                                  continue
                              if has_high_risk_text(text):
                                  print(f'High-risk text pattern in ZIP member {path}: {name}')
                                  ok = False
              except zipfile.BadZipFile:
                  print(f'Invalid ZIP archive: {path}')
                  ok = False

          for path in pathlib.Path('.').rglob('*'):
              if path.is_dir() or '.git' in path.parts:
                  continue
              if path.suffix.lower() == '.zip':
                  check_zip(path)
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if has_high_risk_text(text):
                  for pattern in patterns:
                      if re.search(pattern, text):
                          print(f'High-risk pattern in {path}: {pattern}')
                          break
                  ok = False
          sys.exit(0 if ok else 1)
          PY
